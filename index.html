    <meta
      name="description"
      content="QIVORA — Smart Library Management System. Intelligence for Every Library. Multi-tenant institutional library platform with Digital ID Studio, circulation automation, analytics, and migration tools."
    />
    <meta property="og:title" content="QIVORA — Smart Library Management System" />

      property="og:description"
      content="Intelligence for Every Library. Commercial multi-tenant Library Management SaaS for colleges and universities."
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('qivora-theme') || localStorage.getItem('sharixa-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F6FA] text-[#0F172A] dark:bg-[#0B1120] dark:text-[#F1F5F9] antialiased selection:bg-[#4F46E5]/15 selection:text-[#4F46E5] dark:selection:bg-[#6366F1]/25 dark:selection:text-[#A5B4FC]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
